<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080e19">
  <meta name="description" content="LCZ 游戏 Wiki：探索辐射生存、西部世界与生存工艺的物品、装备和生存资料。">
  <meta property="og:title" content="LCZ · 游戏 Wiki">
  <meta property="og:description" content="选择你的游戏，探索它的世界。">
  <meta property="og:type" content="website">
  <title>LCZ · 游戏 Wiki</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/site-stats.css">
  <link rel="stylesheet" href="assets/portal.css">
  <script src="assets/games.js" defer></script>
  <script src="assets/bubble-physics.js" defer></script>
  <script src="assets/site-stats.js" defer></script>
  <script src="assets/portal.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#game-universe">跳到游戏气泡</a>
  <div class="space-haze" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand-group">
        <a class="brand" href="index.html" aria-label="LCZ 游戏 Wiki 首页">LCZ<span class="brand-dot" aria-hidden="true"></span></a>
        <div data-site-stats data-compact="true" class="site-stats"></div>
      </div>
      <button class="search-trigger" type="button" id="search-open" aria-label="搜索游戏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span>搜索游戏</span><kbd>/</kbd>
      </button>
    </header>
    <main>
      <h1 class="sr-only">LCZ 游戏 Wiki</h1>
      <section class="universe" id="game-universe" aria-label="可拖动的游戏气泡，悬停或长按查看介绍，点击进入 Wiki" tabindex="-1">
        <div class="worlds" id="worlds"></div>
      </section>
      <p id="live-status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <footer class="scene-footer">
      <button class="hint-button" id="help-open" type="button" aria-label="查看操作指南"><span class="hint-desktop">悬停查看 · 点击进入</span><span class="hint-touch">长按查看 · 轻触进入</span></button>
      <div class="scene-controls" aria-label="气泡操作">
        <button class="icon-button" id="motion-toggle" type="button" aria-pressed="false" aria-label="暂停漂浮" title="暂停漂浮"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause-symbol" d="M9 6v12M15 6v12"/><path class="play-symbol" d="m9 5 10 7-10 7Z"/></svg></button>
        <button class="icon-button" id="reset-map" type="button" aria-label="重置气泡位置" title="重置气泡位置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
      </div>
    </footer>
  </div>

  <aside class="game-popover" id="game-info" role="dialog" aria-modal="false" aria-labelledby="info-title" hidden>
    <div class="popover-top"><span class="eyebrow"><i></i> GAME WIKI</span><button id="info-close" class="icon-button" type="button" aria-label="关闭游戏介绍">×</button></div>
    <h2 id="info-title"></h2>
    <p class="info-english" id="info-english"></p>
    <p class="info-description" id="info-description"></p>
    <div class="info-tags" id="info-tags"></div>
    <div class="info-links" id="info-links"></div>
  </aside>

  <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
    <div class="dialog-header"><div><span class="eyebrow">LCZ / SEARCH</span><h2 id="search-title">搜索游戏</h2></div><button class="icon-button dialog-close" type="button" aria-label="关闭搜索">×</button></div>
    <label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input type="search" id="game-search" placeholder="游戏名称、类型或资料" autocomplete="off" aria-label="搜索游戏名称、类型或资料"><kbd>ESC</kbd></label>
    <p class="search-summary" id="search-summary" role="status"></p>
    <div id="search-results"></div>
    <p class="empty-state" id="search-empty" hidden>没有找到这个游戏。<span>试试“西部”“装备”或英文名称。</span></p>
  </dialog>

  <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-header"><div><span class="eyebrow">LCZ / GUIDE</span><h2 id="help-title">随手探索</h2></div><button class="icon-button dialog-close" type="button" aria-label="关闭操作指南">×</button></div>
    <div class="guide-item"><h3>查看介绍</h3><p>电脑上将鼠标放到气泡上；手机和平板上按住气泡片刻。松开手指后，介绍会保持打开。</p></div>
    <div class="guide-item"><h3>进入与拖动</h3><p>点击气泡进入 Wiki，也可以从介绍栏选择入口。按住后移动即可拖动，相邻气泡会轻轻让开。</p></div>
    <div class="guide-item"><h3>按你的节奏</h3><p>右下角可暂停漂浮、恢复初始排列。<kbd>Tab</kbd> 选择游戏，<kbd>Enter</kbd> 进入，方向键移动，<kbd>/</kbd> 搜索，<kbd>Esc</kbd> 关闭介绍。</p></div>
  </dialog>
  <noscript><nav class="noscript-note" aria-label="游戏入口"><a href="Day%20R%20Survival/wiki_dayR.html">辐射生存 / Day R Survival</a><a href="Craft%20of%20Survival/wiki.html">生存工艺 / Craft of Survival</a><a href="Westland%20Survival/westland_wiki.html">西部世界 / Westland Survival</a></nav></noscript>
</body>
</html>
