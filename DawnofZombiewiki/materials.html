<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材浏览器 · DOZ WIKI</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/wiki-mark.svg"><style>main{max-width:1300px}.media-head{display:flex;justify-content:space-between;align-items:center;padding:25px 0}.media-tile{border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:12px;min-width:0}.media-tile img{height:155px;width:100%;object-fit:contain;background:repeating-conic-gradient(#232821 0 25%,#30372a 0 50%) 0/16px 16px}.media-tile h3{font:11px monospace;overflow-wrap:anywhere;color:var(--muted)}.media-tile audio{width:100%;height:36px}.media-tile a{font-size:11px;color:var(--accent)}.media-tile p{font-size:10px;color:var(--dim)}</style></head>
