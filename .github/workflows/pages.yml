name: Deploy LCZ-GameWiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check player data boundaries
        run: |
          node scripts/test-player-data-policy.mjs
          node scripts/check-player-data.mjs

      - name: Check player records and original image integrity
        run: |
          python "Craft of Survival/wiki-assets/tools/validate_assets.py"
          python "Day R Survival/wiki-assets/tools/validate_assets.py"
          python "Westland Survival/tools/verify_assets.py"
          python DawnofZombiewiki/tools/verify_package.py --data-only

      - name: Check shared interactions and publication rules
        run: node --test scripts/test-bubble-physics.cjs scripts/test-site-stats.mjs scripts/test-public-files.mjs scripts/test-asset-versions.mjs

      - name: Check crawler directives and page security
        run: node scripts/test-site-security.mjs

      - name: Prepare and check public files
        run: |
          node scripts/check-site.mjs --stage _site
          node scripts/check-player-data.mjs --root _site

      - name: Upload the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4